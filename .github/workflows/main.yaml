name: Build & Release
on: [push]

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    # Only checks out and builds; @zuplo deps resolve from the public npm registry.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: "yarn"

      - run: yarn install
        env:
          GITHUB_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: yarn build
        env:
          GIT_SHA: ${{ github.sha }}
          API_VERSION: ${{ github.run_id }}
      - run: yarn lint
